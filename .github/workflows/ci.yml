name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r streaming/requirements.txt
          pip install pytest

      - name: Syntax check all components
        run: |
          python -m py_compile generator/event_generator.py
          python -m py_compile streaming/job.py streaming/transformations.py
          python -m py_compile dashboard/app.py

      - name: Run unit tests
        run: pytest tests/ -v
